{% extends "base.html" %}

{% block content %}
<h2>Списки</h2>

<a href="{% url 'list_create' %}" class="btn btn-success mb-3">
    + Створити список
</a>

<div class="list-group">
    {% for item in lists %}
        <a href="{% url 'list_detail' item.pk %}" class="list-group-item list-group-item-action">
            <h5>{{ item.name }}</h5>
            <small>Дедлайн: {{ item.date_limit }}</small>
        </a>
    {% empty %}
        <p>Поки що немає списків.</p>
    {% endfor %}
</div>
{% endblock %}
