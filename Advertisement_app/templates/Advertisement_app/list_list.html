{% extends "base.html" %}

{% block content %}
<h2>Lists</h2>

<a href="{% url 'list_create' %}" class="btn btn-success mb-3">
    + Create List
</a>

<div class="list-group">
    {% for item in lists %}
        <a href="{% url 'list_detail' item.pk %}" class="list-group-item list-group-item-action">
            <h5>{{ item.name }}</h5>
            <small>Deadline: {{ item.date_limit }}</small>
        </a>
    {% empty %}
        <p>No lists yet.</p>
    {% endfor %}
</div>
{% endblock %}
