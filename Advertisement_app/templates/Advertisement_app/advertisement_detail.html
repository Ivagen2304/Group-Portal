{% extends "base.html" %}

{% block content %}
<h2>{{ advertisement.title }}</h2>

<p>{{ advertisement.content }}</p>
<p><small>Created: {{ advertisement.created_at }}</small></p>

<a href="{% url 'advertisement_update' advertisement.pk %}" class="btn btn-warning">Edit</a>
<a href="{% url 'advertisement_delete' advertisement.pk %}" class="btn btn-danger">Delete</a>

<a href="{% url 'advertisement_list' %}" class="btn btn-secondary mt-3">Back</a>
{% endblock %}
