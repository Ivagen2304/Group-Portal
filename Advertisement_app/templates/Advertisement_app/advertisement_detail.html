{% extends "base.html" %}

{% block content %}
<h2>{{ advertisement.title }}</h2>

<p>{{ advertisement.content }}</p>
<p><small>Створено: {{ advertisement.created_at }}</small></p>

<a href="{% url 'advertisement_update' advertisement.pk %}" class="btn btn-warning">Редагувати</a>
<a href="{% url 'advertisement_delete' advertisement.pk %}" class="btn btn-danger">Видалити</a>
<a href="{% url 'advertisement_list' %}" class="btn btn-secondary">Назад</a>
{% endblock %}
