{% extends "base.html" %}

{% block content %}
<h2>Delete Advertisement</h2>

<p>Are you sure you want to delete: <strong>{{ object.title }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'advertisement_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
