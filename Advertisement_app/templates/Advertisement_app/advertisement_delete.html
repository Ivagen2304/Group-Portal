{% extends "base.html" %}

{% block content %}
<h2>Видалити оголошення</h2>

<p>Ви впевнені, що хочете видалити оголошення: <strong>{{ advertisement.title }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Видалити</button>
    <a href="{% url 'advertisement_list' %}" class="btn btn-secondary">Скасувати</a>
</form>
{% endblock %}
