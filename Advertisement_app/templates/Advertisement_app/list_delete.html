{% extends "base.html" %}

{% block content %}
<h2>Delete List</h2>

<p>Do you really want to delete "<strong>{{ object.name }}</strong>"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'list_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
