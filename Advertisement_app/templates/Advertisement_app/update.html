

{% block content %}
<div class="container mt-4">

    <h2>Редагувати оголошення</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success mt-2">Зберегти</button>
        <a href="{% url 'advertisements:detail' object.pk %}" class="btn btn-secondary mt-2">Назад</a>
    </form>

</div>
{% endblock %}
