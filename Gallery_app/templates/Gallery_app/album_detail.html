{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Альбом: {{ album.name }}</h2>

<p><strong>Опис:</strong> {{ album.description }}</p>

<hr>

<h4>Зображення</h4>
<div class="row">
    {% for image in images %}
    <div class="col-md-3 mb-3">
        <a href="{% url 'image_detail' image.pk %}">
            <img src="{{ image.image.url }}" class="img-fluid rounded shadow">
        </a>
    </div>
    {% empty %}
        <p>Цей альбом поки не містить зображень.</p>
    {% endfor %}
</div>

{% endblock %}
