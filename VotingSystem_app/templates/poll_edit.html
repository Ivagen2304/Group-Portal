{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <h2>Редагування голосування</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <h5 class="mt-4">Варіанти відповідей</h5>

        {% for option in poll.options.all %}
        <div class="input-group mb-2">
            <input class="form-control" value="{{ option.text }}" disabled>
        </div>
        {% endfor %}

        <a href="{% url 'poll_add_option' poll.id %}" class="btn btn-secondary btn-sm">
            Додати варіант
        </a>

        <button class="btn btn-success mt-3">Зберегти</button>
    </form>

</div>

{% endblock %}
