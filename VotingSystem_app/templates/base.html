<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Site</title></head>
<body>
<div style="display:flex;min-height:100vh;">
  <aside style="width:200px;padding:16px;background:#f5f5f5;">
    {% if user.is_authenticated %}
      <div><strong>{{ user.username }}</strong></div>
      <nav style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">
        <a href="{% url 'accounts:home' %}">Головна</a>
        <a href="{% url 'moderation:notifications' %}">Сповіщення</a>
        {% if user.is_moderator %}
          <a href="{% url 'moderation:create_poll' %}" style="color:white;background:red;padding:6px;border-radius:4px;display:inline-block;text-decoration:none;">Зробити оголошення</a>
        {% endif %}
        <form method="post" action="{% url 'accounts:logout' %}" style="margin-top:8px;">
          {% csrf_token %}
          <button type="submit" style="background:none;border:none;padding:0;color:blue;cursor:pointer;">Вийти</button>
        </form>
      </nav>
    {% else %}
      <a href="{% url 'accounts:register_choice' %}">Реєстрація</a><br>
      <a href="{% url 'accounts:login' %}">Увійти</a>
    {% endif %}
  </aside>
  <main style="flex:1;padding:16px;">
    {% for msg in messages %}<div style="background:#ffd; padding:8px;margin-bottom:8px;">{{ msg }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
