{% extends "base.html" %}
{% block content %}
<h2>Видалити тему "{{ topic.title }}"?</h2>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Так, видалити</button>
    <a class="btn btn-secondary" href="{% url 'topic_list' topic.category.pk %}">Скасувати</a>
</form>

{% endblock %}
