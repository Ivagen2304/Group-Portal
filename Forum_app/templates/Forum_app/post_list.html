<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Posts in {{ topic.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>{{ topic.title }}</h1>
            <a href="{% url 'Forum_app:create_post' topic.id %}" class="btn btn-success">Add Post</a>
        </div>
        <div class="mb-3">
            <a href="{% url 'Forum_app:topic_list' topic.category.id %}" class="btn btn-secondary">Back to Topics</a>
            <a href="{% url 'Forum_app:category_list' %}" class="btn btn-secondary">Back to Categories</a>
        </div>
        {% for post in posts %}
            <div class="card mb-3">
                <div class="card-header d-flex justify-content-between">
                    <strong>{{ post.author.username }}</strong>
                    <small class="text-muted">{{ post.created_at }}</small>
                </div>
                <div class="card-body">
                    <p class="card-text">{{ post.content }}</p>
                </div>
            </div>
        {% empty %}
            <p class="text-muted">No posts yet in this topic.</p>
        {% endfor %}
    </div>
</body>
</html>
