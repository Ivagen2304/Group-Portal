{% extends "base.html" %}
{% block content %}
<h2>Видалити категорію "{{ category.name }}"?</h2>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Так, видалити</button>
    <a class="btn btn-secondary" href="{% url 'category_list' %}">Скасувати</a>
</form>

{% endblock %}
