{% extends "base.html" %}
{% block content %}
<h2>Теми категорії: {{ category.name }}</h2>

<a class="btn btn-primary mb-2" href="{% url 'topic_create' category.pk %}">Створити тему</a>


<ul class="list-group">
    {% for topic in topics %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="{% url 'topic_detail' topic.pk %}">{{ topic.title }}</a>
            <div>
                <a class="btn btn-sm btn-warning" href="{% url 'topic_update' topic.pk %}">Редагувати</a>
                <a class="btn btn-sm btn-danger" href="{% url 'topic_delete' topic.pk %}">Видалити</a>
            </div>
        </li>
    {% empty %}
        <li class="list-group-item">Немає тем.</li>
    {% endfor %}
</ul>

<a class="btn btn-secondary mt-3" href="{% url 'category_list' %}">Назад</a>

{% endblock %}
