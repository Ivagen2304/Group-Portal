<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topics in {{ category.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Topics in "{{ category.name }}"</h1>
            <a href="{% url 'Forum_app:create_topic' category.id %}" class="btn btn-success">Create New Topic</a>
        </div>
        <a href="{% url 'Forum_app:category_list' %}" class="btn btn-secondary mb-3">Back to Categories</a>
        <div class="list-group">
            {% for topic in topics %}
                <a href="{% url 'Forum_app:post_list' topic.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    {{ topic.title }} - <small class="text-muted">by {{ topic.author.username }}</small>
                    <span class="badge bg-primary rounded-pill">{{ topic.views }} views</span>
                </a>
            {% empty %}
                <p class="text-muted">No topics yet in this category.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
