<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Topic in {{ category.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Create New Topic in "{{ category.name }}"</h1>
        <form method="post" class="bg-white p-4 rounded shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                {{ topic_form.title.label_tag }}
                {{ topic_form.title }}
            </div>
            <div class="mb-3">
                {{ post_form.content.label_tag }}
                {{ post_form.content }}
            </div>
            <button type="submit" class="btn btn-primary">Create Topic</button>
        </form>
        <div class="mt-3">
            <a href="{% url 'Forum_app:topic_list' category.id %}" class="btn btn-secondary">Back to Topics</a>
            <a href="{% url 'Forum_app:category_list' %}" class="btn btn-secondary">Back to Categories</a>
        </div>
    </div>
</body>
</html>
