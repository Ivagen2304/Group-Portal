{% extends "base.html" %}
{% block content %}
<h2>Категорії форуму</h2>

<a class="btn btn-primary mb-3" href="{% url 'category_create' %}">Створити категорію</a>

<ul class="list-group">
    {% for cat in categories %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="{% url 'category_detail' cat.pk %}">{{ cat.name }}</a>
            <div>
                <a class="btn btn-sm btn-warning" href="{% url 'category_update' cat.pk %}">Редагувати</a>
                <a class="btn btn-sm btn-danger" href="{% url 'category_delete' cat.pk %}">Видалити</a>
            </div>
        </li>
    {% empty %}
        <li class="list-group-item">Категорій ще немає.</li>
    {% endfor %}
</ul>
{% endblock %}
