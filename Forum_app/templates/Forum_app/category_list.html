<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forum - Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">Forum Categories</h1>
        <div class="list-group">
            {% for category in categories %}
                <a href="{% url 'Forum_app:topic_list' category.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    {{ category.name }}
                    <span class="badge bg-primary rounded-pill">{{ category.topics.count }}</span>
                </a>
            {% empty %}
                <p class="text-muted">No categories available.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
