<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Post to {{ topic.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Add Post to "{{ topic.title }}"</h1>
        <form method="post" class="bg-white p-4 rounded shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.content.label_tag }}
                {{ form.content }}
            </div>
            <button type="submit" class="btn btn-success">Add Post</button>
        </form>
        <div class="mt-3">
            <a href="{% url 'Forum_app:post_list' topic.id %}" class="btn btn-secondary">Back to Posts</a>
            <a href="{% url 'Forum_app:topic_list' topic.category.id %}" class="btn btn-secondary">Back to Topics</a>
            <a href="{% url 'Forum_app:category_list' %}" class="btn btn-secondary">Back to Categories</a>
        </div>
    </div>
</body>
</html>
