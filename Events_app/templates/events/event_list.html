{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Мероприятия</h2>
        <a href="{% url 'event_create' %}" class="btn btn-success">Створити подію</a>
    </div>

    <div class="row">
        {% for event in events %}
        <div class="col-md-4 mb-4">
            <a href="{% url 'event_detail' event.pk %}" class="text-decoration-none text-dark">
                <div class="card shadow-sm">

                    {% if event.cover %}
                        <img src="{{ event.cover.url }}" class="card-img-top" style="height: 200px; object-fit: cover;">
                    {% else %}
                        <div style="height: 200px; background: #67707c;"
                             class="d-flex justify-content-center align-items-center text-white">
                            Немає зображення
                        </div>
                    {% endif %}

                    <div class="card-body">
                        <h5>{{ event.title }}</h5>
                        <p>{{ event.date }}</p>
                    </div>

                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
