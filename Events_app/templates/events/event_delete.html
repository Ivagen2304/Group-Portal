{% extends "base.html" %}

{% block content %}
<div class="container mt-4 text-center">

    <h2>Видалити подію?</h2>
    <p>Ви впевнені, що хочете видалити <b>{{ event.title }}</b>?</p>

    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Видалити</button>
        <a href="{% url 'event_detail' event.pk %}" class="btn btn-secondary">Скасувати</a>
    </form>

</div>
{% endblock %}
