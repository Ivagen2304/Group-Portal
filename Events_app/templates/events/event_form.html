{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2>{{ form_title }}</h2>

    <form method="post" enctype="multipart/form-data" class="mt-3">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Назва події</label>
            {{ form.title }}
        </div>

        <div class="mb-3">
            <label class="form-label">Опис</label>
            {{ form.description }}
        </div>

        <div class="mb-3">
            <label class="form-label">Дата</label>
            {{ form.date }}
        </div>

        <div class="mb-3">
            <label class="form-label">Обкладинка (необов’язково)</label>
            {{ form.cover }}
        </div>

        <button type="submit" class="btn btn-success">Зберегти</button>
        <a href="{% url 'event_list' %}" class="btn btn-secondary">Назад</a>
    </form>
</div>
{% endblock %}
