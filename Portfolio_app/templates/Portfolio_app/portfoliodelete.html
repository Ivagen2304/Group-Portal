{# extends "base.html" #}
{# block content #}
<div class = "container">
    <h2>Видалення портфолio</h2>
    <p>Ви впевнинi, що хочете видалити портфолio</p>
    <form method = "post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type = "submit" class = "btn btn-danger">Так, видалити</button>
        <a href = "{% url 'portfoliolist' %}" class = "btn btn-secondary">Нi, назад до списку портфолio</a>
    </form>
</div>
{# endblock #}
