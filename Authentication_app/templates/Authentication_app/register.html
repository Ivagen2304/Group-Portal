{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Регистрация</h2>

    <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success mt-2">Зарегистрироваться</button>
    </form>

    <p class="mt-3">
        Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
    </p>
</div>
{% endblock %}
