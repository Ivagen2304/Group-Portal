{% extends "base.html" %}

{% block content %}
<h2>Видалити матеріал</h2>

<p>Ти впевнений, що хочеш видалити <b>{{ material.title }}</b>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Так, видалити</button>
    <a href="{% url 'material_detail' material.pk %}" class="btn btn-secondary">Скасувати</a>
</form>
{% endblock %}
