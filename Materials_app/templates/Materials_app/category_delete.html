{% extends "base.html" %}

{% block content %}
<h2>Видалити розділ</h2>

<p>Ти впевнений, що хочеш видалити розділ <b>{{ category.name }}</b>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Так, видалити</button>
    <a href="{% url 'material_category_list' %}" class="btn btn-secondary">Скасувати</a>
</form>
{% endblock %}
